<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0;url=/products">
  <title>Redirecting…</title>
  <script>
    (function () {
      var p = location.pathname || '';
      var base = (p.indexOf('/reviews') === 0) ? '/reviews/products' : '/products';
      location.replace(base);
    })();
  </script>
</head>
<body>
  <p><a href="/products">Continue to products</a></p>
</body>
</html>
